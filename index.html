:root{--rule:#E8E5E0;--hair:#EFEDE9}

  const vv = window.visualViewport; t.classList.toggle('top', !!vv && (innerHeight - vv.height) > 120); t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'), ms); }
function containsBadWords(s, chat){ const l=(s||'').toLowerCase(); return BAD_WORDS.filter(w=>!(chat && CHAT_OK.includes(w)) && l.includes(w.toLowerCase())); }
const CHAT_OK = ['出場','定點','全套'];   // 日常對話也會用到的詞，訊息裡不擋（自介仍擋）

async function signed(path){
  if(!path) return null;
  const c = urlCache.get(path);
  if(c && c.exp > Date.now()) return c.url;
  const { data } = await sb.storage.from('photos').createSignedUrl(path, 900);   // 15 分鐘就失效，外流的連結很快沒用
  const u = data?.signedUrl || null;
  if(u) urlCache.set(path, { url:u, exp: Date.now() + 10*60*1000 });
  return u;
}
async function compressImage(file, max=1080, q=.85){
  const src = URL.createObjectURL(file);
  const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('無法讀取這張照片，請改用 JPG 或 PNG')); i.src=src; }).finally(()=>setTimeout(()=>URL.revokeObjectURL(src), 0));
  const s = Math.min(1, max/Math.max(img.width,img.height));
  const c = document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return new Promise(res=>c.toBlob(res,'image/jpeg',q));
}

async function loadMe(){
  const { data: { session: s } } = await sb.auth.getSession();
  session = s;
  lastUid = session?.user?.id || null;
  if(!session){ me=null; authUser=null; return; }
  const { data: gu } = await sb.auth.getUser(); authUser = gu?.user || session.user;
  const { data } = await sb.rpc('get_me').maybeSingle();
  me = data;
  if(me && me.show_online!==false) sb.from('profiles').update({ last_active_at: new Date().toISOString() }).eq('id', me.id).then(()=>{});
}
lastUid = undefined;
sb.auth.onAuthStateChange(async (ev, s)=>{
  if(ev==='PASSWORD_RECOVERY'){ recovering = true; lastUid = s?.user?.id; setTimeout(openPasswordReset, 300); return; }
  if(ev==='SIGNED_OUT'){ urlCache.clear(); browseState.role=null; resetBrowse(); }
  // 切回分頁、選照片時 supabase 會再發 SIGNED_IN；同一個人就不重畫，避免正在填的表單被清掉
  const uid = s?.user?.id || null;
  if((ev==='SIGNED_IN'||ev==='SIGNED_OUT') && uid!==lastUid){ lastUid = uid; setTimeout(async ()=>{ await loadMe(); route(); }, 0); }
});
async function verifyEmailOtp(p){ // p: {token_hash,type} 或 {email,token,type}
  let r = await sb.auth.verifyOtp(p);
  if(r.error && p.type==='email') r = await sb.auth.verifyOtp({ ...p, type:'signup' });
  return r;
}

async function refreshUnread(){
  if(!me || !['approved','pending'].includes(me.status)) return;
  const { data: ms } = await sb.from('matches').select('id').or(`user_a.eq.${me.id},user_b.eq.${me.id}`);
  const setBadge = n => (document.title = (n>0?`(${n>99?'99+':n}) `:'') + document.title.replace(/^\(\S+\) /,''), document.querySelectorAll('a[href="#/matches"]')).forEach(a=>{ a.querySelector('.badge')?.remove(); if(n>0) a.insertAdjacentHTML('beforeend',`<span class="badge">${n>99?'99+':n}</span>`); });
  if(!ms || !ms.length) return setBadge(0);
  const { count } = await sb.from('messages').select('id',{count:'exact',head:true}).is('read_at',null).neq('sender_id',me.id).in('match_id',ms.map(m=>m.id));
  setBadge(count||0);
}
setInterval(()=>{ if(document.visibilityState==='visible') refreshUnread(); }, 60000);
let lastHidden = 0;
document.addEventListener('visibilitychange', async ()=>{
  if(document.visibilityState==='hidden'){ lastHidden = Date.now(); return; }
  if(!me || Date.now()-lastHidden < 20000 || $('#modal').innerHTML) return;   // 只離開一下（例如選照片）就不重畫
  const typing = $('#chIn')?.value || [...document.querySelectorAll('#app input[type=text],#app textarea')].some(x=>x.value && x.value!==x.defaultValue);
  if(typing){ refreshUnread(); return; }   // 正在打字或改資料，不要把內容洗掉
  const before = me.status; await loadMe(); if(!me) return;
  if(me.status!==before){ if(me.status==='approved') toast('🎉 你的檔案已通過審核，可以開始探索了', 6000); route(); }
  else if(location.hash.startsWith('#/chat/') || location.hash.startsWith('#/matches')) route();
  else refreshUnread();
});

let chatChannel = null, routeSeq = 0;
async function route(){
  routeSeq++;
  if(chatChannel){ sb.removeChannel(chatChannel); chatChannel=null; }
  if(!recovering) closeModal();
  const [path, arg] = (location.hash.replace(/^#\//,'').split('?')[0]||'').split('/');
  renderNav();
  document.body.classList.toggle('home', !path || path==='about');
  document.body.dataset.page = path || 'home';
  const app = $('#app'); app.innerHTML = '<div class="spinner"></div>';
  const protectedPages = ['browse','likes','matches','chat','me','admin','onboarding'];
  if(protectedPages.includes(path) && !me){ location.hash='#/auth'; return; }
  if(me && me.status==='incomplete' && !me.is_admin && ['','browse','likes','matches','chat'].includes(path||'')){ location.hash='#/onboarding'; return; }
  if(me && !me.is_admin && me.status!=='incomplete' && missingBasics(me).length && ['browse','likes','matches','chat'].includes(path)){ sessionStorage.setItem('meTab','profile'); toast('請先完成基本資料'); location.hash='#/me'; return; }
  if(!localStorage.getItem('yy_age_ok')) $('#gate').classList.toggle('hidden', ['terms','privacy','guidelines','safety'].includes(path));
  const fn = routes[path] || viewLanding;
  const seq = routeSeq;
  try { await fn(arg); } catch(e){ console.error(e); if(seq!==routeSeq) return; app.innerHTML = `<div class="banner bad">載入失敗：${esc(zh(e.message||e))}　<a href="javascript:location.reload()">重新整理</a></div>`; }
  if(seq===routeSeq) window.scrollTo(0,0);
}

async function viewAuth(){
  if(me){ location.hash = me.status==='incomplete' ? '#/onboarding' : '#/browse'; return; }
  let mode = (location.hash.includes('mode=login')) ? 'login' : 'register';
  const draw = () => {
    $('#app').innerHTML = `<div class="authwrap">
      <div class="side" style="background-image:url('${IMG.auth}')"><div class="q"><h3>有些相遇，<br>值得慢慢來。</h3><p>每一位會員都經過真人審核</p></div></div>
      <div class="form">
      <div class="tabs"><button class="${mode==='register'?'on':''}" data-m="register">免費註冊</button><button class="${mode==='login'?'on':''}" data-m="login">登入</button></div>
      <div id="oauthBox"></div>
      <form id="authForm">
        <label>Email</label><input type="email" name="email" required autocomplete="email" placeholder="you@example.com">
        <label>密碼</label><div class="pwrap"><input type="password" name="password" required minlength="8" autocomplete="${mode==='login'?'current-password':'new-password'}" placeholder="至少 8 碼"><button type="button" class="pwshow" aria-label="顯示密碼">顯示</button></div>
        ${mode==='register' ? `
        <label style="display:flex;gap:10px;align-items:flex-start;margin-top:18px;color:var(--text);font-size:14px"><input type="checkbox" name="age" required style="width:auto;margin-top:4px"><span>我確認已年滿 18 歲（或所在地法定成年年齡）</span></label>
        <label style="display:flex;gap:10px;align-items:flex-start;margin-top:8px;color:var(--text);font-size:14px"><input type="checkbox" name="terms" required style="width:auto;margin-top:4px"><span>我已閱讀並同意<a href="#/terms" target="_blank">使用條款</a>、<a href="#/privacy" target="_blank">隱私政策</a>與<a href="#/guidelines" target="_blank">社群守則</a>，並了解本站禁止任何金錢交易與色情招攬</span></label>` : ''}
        ${mode==='register'?'<p class="tiny dim mt">註冊流程：驗證 Email → 簡訊驗證手機（一支手機只能註冊一個帳號，號碼不會給任何會員看到）→ 建立檔案。建立檔案時會請你設定暱稱、性別與想認識的對象，送出後無法修改。</p>':''}
        <button class="btn primary block mt2" type="submit">${mode==='register'?'建立帳號':'登入'}</button>
        ${mode==='login' ? `<button class="btn ghost block mt" type="button" id="forgot">忘記密碼</button>`:''}
        <p class="small bad mt" id="authErr"></p>
      </form></div></div>`;
    document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ mode=b.dataset.m; draw(); });
    loadOAuth().then(av=>{ const box=$('#oauthBox'); if(!box || (!av.google && !av.line)) return;
      box.innerHTML = `<div class="oauth">${av.line?`<button type="button" class="btn block obtn" data-k="line">${OAUTH_ICON.line}使用 LINE ${mode==='register'?'註冊':'登入'}</button>`:''}${av.google?`<button type="button" class="btn block obtn" data-k="google">${OAUTH_ICON.google}使用 Google ${mode==='register'?'註冊':'登入'}</button>`:''}
        ${mode==='register'?'<p class="tiny dim">繼續即表示你確認已年滿 18 歲，並同意<a href="#/terms" target="_blank">使用條款</a>、<a href="#/privacy" target="_blank">隱私政策</a>與<a href="#/guidelines" target="_blank">社群守則</a>。我們只會取得你的 Email、名稱與大頭貼，不會公開你的名稱，也不會在你的社群帳號發文。</p>':''}
        <div class="or"><span>或使用 Email</span></div></div>`;
      box.querySelectorAll('.obtn').forEach(b=>b.onclick=()=>{ b.disabled=true; oauthSignIn(b.dataset.k); }); });
    $('.pwshow').onclick = e => { const i=e.target.previousElementSibling; const sh=i.type==='password'; i.type=sh?'text':'password'; e.target.textContent=sh?'隱藏':'顯示'; };
    $('#authForm').onsubmit = async e => {
      e.preventDefault(); const f = new FormData(e.target); const email=f.get('email').trim(), password=f.get('password');
      const btn = e.target.querySelector('button[type=submit]'); btn.disabled=true;
      let err;
      if(mode==='register'){
        const r = await sb.auth.signUp({ email, password, options:{ emailRedirectTo: location.origin + location.pathname } });
        err = r.error;
        if(!err && r.data?.user && Array.isArray(r.data.user.identities) && r.data.user.identities.length===0){ btn.disabled=false; $('#authErr').textContent='這個 Email 已經註冊過了，請直接登入，或用「忘記密碼」重設。'; return; }
        if(!err){
          if(r.data.session){ toast('註冊成功！'); }
          else { $('#app').innerHTML = `<div class="narrow card center"><h3 style="color:var(--gold2)">請到信箱收驗證信</h3><p class="muted mt">我們已寄一封驗證信到 <b>${esc(email)}</b>。點擊信中連結後即可登入，接著驗證手機、建立檔案。</p>
            ${codeBox('suCode')}<p class="tiny dim mt">沒收到？請看看垃圾郵件匣，或稍等一分鐘再重寄。</p><button class="btn ghost mt2" id="resend">重寄驗證信</button> <a class="btn ghost mt2" href="#/auth?mode=login">我已驗證，去登入</a></div>`;
            $('#suCode').onsubmit = async ev=>{ ev.preventDefault(); const b=ev.target.querySelector('button'); b.disabled=true;
              const { error } = await verifyEmailOtp({ email, token: new FormData(ev.target).get('code').trim(), type:'email' }); b.disabled=false;
              if(error){ ev.target.querySelector('[data-err]').textContent='驗證碼不正確或已過期，請重寄一封再試。'; return; } toast('Email 驗證成功'); };
            $('#resend').onclick = async ()=>{ const { error } = await sb.auth.resend({ type:'signup', email, options:{ emailRedirectTo: location.origin + location.pathname } }); toast(error?error.message:'已重新寄出驗證信'); };
            return; }
        }
      } else {
        const r = await sb.auth.signInWithPassword({ email, password }); err = r.error;
      }
      btn.disabled=false;
      if(err){ $('#authErr').textContent = zh(err.message);
        if(/Email not confirmed/i.test(err.message)){ $('#authErr').insertAdjacentHTML('beforeend', ' <a href="#" id="reAuth">重寄驗證信</a>');
          $('#reAuth').onclick = async ev=>{ ev.preventDefault(); const { error } = await sb.auth.resend({ type:'signup', email, options:{ emailRedirectTo: location.origin + location.pathname } }); toast(error?error.message:'已重寄，請到信箱收信'); }; } }
    };
    const fg = $('#forgot'); if(fg) fg.onclick = async ()=>{ const email = $('input[name=email]').value.trim(); if(!email) return toast('請先輸入 Email');
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname }); if(error) return toast(zh(error.message));
      modal(`<h2>重設密碼</h2><p class="muted small mt">如果 <b>${esc(email)}</b> 有註冊微糖，我們已寄出一封重設密碼信。按信中的按鈕，或在這裡輸入信中的驗證碼。</p>${codeBox('rpCode')}<p class="tiny dim mt">沒收到？請看看垃圾郵件匣。</p>`);
      $('#rpCode').onsubmit = async ev=>{ ev.preventDefault(); const b=ev.target.querySelector('button'); b.disabled=true;
        const { error } = await sb.auth.verifyOtp({ email, token: new FormData(ev.target).get('code').trim(), type:'recovery' }); b.disabled=false;
        if(error) ev.target.querySelector('[data-err]').textContent='驗證碼不正確或已過期，請重新申請。'; }; };
  };
  draw();
}

function smsErr(e){

const regionOf = c => Object.keys(REGIONS).find(k=>REGIONS[k].includes(c)) || '';
const nearScore = c => !me?.city ? 0 : c===me.city ? 2 : (regionOf(c) && regionOf(c)===regionOf(me.city)) ? 1 : 0;
const activeBucket = t => { if(!t) return 9; const m=(Date.now()-new Date(t))/60000; return m<15?0 : m<60*24?1 : m<60*24*3?2 : m<60*24*7?3 : m<60*24*30?4 : 5; };

function sortRows(rows, mode){
  const t = r => r.last_active_at ? +new Date(r.last_active_at) : 0, c = r => +new Date(r.created_at||0);
  // 甜心創始會員：優先曝光期間、且一週內有上線，排在最前面（不顯示標記）
  const boost = r => r.founder_boost_until && new Date(r.founder_boost_until) > new Date() && activeBucket(r.last_active_at) <= 3 ? 1 : 0;
  const cmp = { rec:(a,b)=> boost(b)-boost(a) || activeBucket(a.last_active_at)-activeBucket(b.last_active_at) || nearScore(b.city)-nearScore(a.city) || t(b)-t(a),
    online:(a,b)=> t(b)-t(a) || c(b)-c(a), near:(a,b)=> nearScore(b.city)-nearScore(a.city) || t(b)-t(a), new:(a,b)=> c(b)-c(a) }[mode] || (()=>0);
  rows.sort(cmp); return rows; }

      :`<div class="s">${sub}</div>`}</div>

    if(before==='rejected'){ const { error: e2 } = await sb.rpc('resubmit_profile'); if(e2){ btn.disabled=false; return toast(e2.message); } toast('已重新送審，通常 24 小時內完成'); }
    else if(before==='approved' && upd?.status==='pending') toast('已儲存。修改的內容需要重新審核，期間新的會員暫時看不到你。', 6000);
    else toast('已儲存');
    viewMe(); };
  bindAccount();
}
function bindAccount(){
  $('#pwBtn') && ($('#pwBtn').onclick = ()=>openPasswordReset('更改密碼'));
  $('#logoutBtn').onclick = async ()=>{ await sb.auth.signOut(); location.hash='#/'; };
  $('#delBtn').onclick = ()=>{ modal(`<h2>刪除帳號</h2>
      <div class="banner bad mt">刪除後<b>立即生效、無法復原</b>，客服也救不回來。</div>
      <p class="small">以下資料會全部永久刪除：</p>
      <ul class="delwarn"><li>你的檔案、頭像、公開照與私密照</li><li>所有心動紀錄與對話（對方那邊也會一起消失）</li><li>私密照授權、索取與封鎖名單</li><li>綁定的手機號碼與登入信箱</li></ul>
      <p class="small muted mt">如果只是想暫時休息，可以改用「隱私設定 → 不出現在探索」。</p>
      <p class="tiny dim">帳號被停權或有處理中的檢舉時，需等處理完才能刪除。</p>
      <label class="mt2">請輸入「刪除」兩個字確認</label><input id="delIn" autocomplete="off">
      <div class="row mt2" style="justify-content:flex-end;gap:10px"><button class="btn" id="delNo">取消</button><button class="btn danger" id="delYes" disabled>永久刪除我的帳號</button></div>`);
    $('#delIn').oninput = ()=>{ $('#delYes').disabled = $('#delIn').value.trim()!=='刪除'; };
    $('#delNo').onclick = closeModal;
    $('#delYes').onclick = async ()=>{ const b=$('#delYes'); b.disabled=true; b.textContent='刪除中…';
      try{
        // 1. 先解除照片登記，才能刪掉檔案
        let r = await sb.rpc('begin_account_deletion'); if(r.error) throw r.error;
        // 2. 刪掉自己資料夾裡的所有檔案
        for(const bk of ['photos','verify','person']) for(let i=0;i<20;i++){ const { data: files, error } = await sb.storage.from(bk).list(me.id, { limit:100 }); if(error) throw error;
          const names = (files||[]).filter(f=>f.id).map(f=>`${me.id}/${f.name}`); if(!names.length) break;
          const { error: e2 } = await sb.storage.from(bk).remove(names); if(e2) throw e2; if(names.length<100) break; }
        // 3. 刪除帳號（含手機、信箱與所有資料）
        r = await sb.rpc('delete_my_account'); if(r.error) throw r.error;
        await sb.auth.signOut({ scope:'local' }).catch(()=>{}); me=null; session=null; authUser=null; closeModal(); location.hash='#/bye';
      }catch(err){ b.disabled=false; b.textContent='永久刪除我的帳號'; toast('刪除沒有完成：'+(err.message||err)+'，請再試一次'); }
    }; };
}

function viewDoc(k){ $('#app').innerHTML = `<div class="doc card">${DOCS[k]}</div>`; }

/* ---------- 啟動 ---------- */
(async ()=>{
  const hp = new URLSearchParams(location.hash.replace(/^#/,'')); const err = hp.get('error_description') || new URLSearchParams(location.search).get('error_description');
  if(err){ history.replaceState(null,'',location.pathname); setTimeout(()=>toast(/expired|invalid/i.test(err)?'驗證連結已失效。請到登入頁輸入帳號密碼，再按「重寄驗證信」':zh(err), 7000), 400); }
  const sp = new URLSearchParams(location.search);
  if(sp.get('th')){ const th=sp.get('th'), tt=sp.get('tt')||'email'; history.replaceState(null,'',location.pathname+location.hash);
    const { error } = await verifyEmailOtp({ token_hash: th, type: tt });
    if(error) setTimeout(()=>toast('這個連結已失效或已用過。請回到登入頁重新申請。', 7000), 400);
    else if(tt!=='recovery') setTimeout(()=>toast(tt==='email_change'?'Email 已更新':'Email 驗證成功，歡迎加入微糖'), 400); }
  await loadMe(); route(); })();
</script>
