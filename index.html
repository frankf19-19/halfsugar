  const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); });

function profileFormHtml(p={}){
  const years = []; const y0 = new Date().getFullYear()-18; for(let y=y0;y>=y0-62;y--) years.push(y);
  return `
    <label>暱稱 *</label><input name="nickname" required maxlength="20" value="${esc(p.nickname||'')}" placeholder="其他會員看到的名字">
    <div class="row">
      <div class="grow"><label>我是 *</label><select name="gender" required><option value="">請選擇</option><option value="male" ${p.gender==='male'?'selected':''}>男性</option><option value="female" ${p.gender==='female'?'selected':''}>女性</option></select></div>
      <div class="grow"><label>想認識 *</label><select name="looking_for" required><option value="">請選擇</option><option value="female" ${p.looking_for==='female'?'selected':''}>女性</option><option value="male" ${p.looking_for==='male'?'selected':''}>男性</option><option value="any" ${p.looking_for==='any'?'selected':''}>不限</option></select></div>
    </div>
    <div class="row">
      <div class="grow"><label>出生年 *</label><select name="birth_year" required><option value="">請選擇</option>${years.map(y=>`<option value="${y}" ${p.birth_year==y?'selected':''}>${y}（${age(y)} 歲）</option>`).join('')}</select></div>
      <div class="grow"><label>所在地 *</label><select name="city" required><option value="">請選擇</option>${CITIES.map(c=>`<option ${p.city===c?'selected':''}>${c}</option>`).join('')}</select></div>
    </div>
    <div class="row">
      <div class="grow"><label>身高（cm）</label><input name="height_cm" type="number" min="100" max="250" value="${esc(p.height_cm||'')}"></div>
      <div class="grow"><label>職業</label><input name="occupation" maxlength="30" value="${esc(p.occupation||'')}" placeholder="例如：外商主管、設計師"></div>
    </div>
    <label>興趣（最多 8 個）</label>
    <div class="tags" id="tagPick">${TAGS.map(t=>`<button type="button" class="tag ${(p.tags||[]).includes(t)?'on':''}" data-t="${t}">${t}</button>`).join('')}</div>
    <label>自我介紹 *</label><textarea name="bio" required maxlength="600" placeholder="說說你是誰、生活的樣子、想認識怎樣的人。可以寫你期待的相處方式與見面節奏；請勿留聯絡方式，也不要寫任何金額或價碼。">${esc(p.bio||'')}</textarea>
    <p class="tiny dim">自介中若出現聯絡方式（LINE、電話、IG）、金額價碼或性交易相關字眼，將無法通過審核。</p>`;
}
function bindTagPick(){ $('#tagPick')?.addEventListener('click', e=>{ const b=e.target.closest('.tag'); if(!b) return;
  if(!b.classList.contains('on') && $('#tagPick').querySelectorAll('.on').length>=8) return toast('最多 8 個興趣'); b.classList.toggle('on'); }); }
function readProfileForm(form){
  const f = new FormData(form); const tags=[...$('#tagPick').querySelectorAll('.on')].map(b=>b.dataset.t);
  const bio = f.get('bio').trim();
  const bad = containsBadWords(bio + ' ' + f.get('nickname') + ' ' + f.get('occupation'));
  if(bad.length) { toast(`自介含不允許的字眼：${bad.join('、')}`); return null; }
  if(/line|ig\b|instagram|telegram|wechat|微信|\d{8,}/i.test(bio)) { toast('自介請勿留下聯絡方式'); return null; }
  return { nickname:f.get('nickname').trim(), gender:f.get('gender'), looking_for:f.get('looking_for'), birth_year:+f.get('birth_year'),
    city:f.get('city'), height_cm: f.get('height_cm')? +f.get('height_cm') : null, occupation:f.get('occupation').trim()||null, bio, tags };
}
async function uploadPhoto(file){
  const blob = await compressImage(file);
  const path = `${me.id}/${Date.now()}.jpg`;
  const { error } = await sb.storage.from('photos').upload(path, blob, { contentType:'image/jpeg', upsert:false });
  if(error) throw error; return path;
}

async function viewOnboarding(){
  if(me.status!=='incomplete'){ location.hash='#/me'; return; }
  $('#app').innerHTML = `<div class="narrow">
    <h2 style="font-size:24px;color:var(--gold2)">建立你的檔案</h2>

const browseState = { gender: null, city:'', amin:'', amax:'' };
async function viewBrowse(){
  if(browseState.gender===null) browseState.gender = me.looking_for==='any' ? '' : (me.looking_for || '');
  $('#app').innerHTML = `${statusBanner()}
    <div class="filters">
      <select id="fGender" aria-label="性別"><option value="">性別不限</option><option value="female" ${browseState.gender==='female'?'selected':''}>女性</option><option value="male" ${browseState.gender==='male'?'selected':''}>男性</option></select>
      <select id="fCity" aria-label="地區"><option value="">地區不限</option>${CITIES.map(c=>`<option ${browseState.city===c?'selected':''}>${c}</option>`).join('')}</select>
      <select id="fAge" aria-label="年齡"><option value="">年齡不限</option>${[['18','25'],['26','30'],['31','35'],['36','40'],['41','50'],['51','99']].map(([a,b])=>`<option value="${a}-${b}" ${browseState.amin===a?'selected':''}>${b==='99'?a+' 歲以上':a+'–'+b+' 歲'}</option>`).join('')}</select>
    </div>
    <div id="grid" class="grid"><div class="spinner" style="grid-column:1/-1"></div></div>`;
  const reload = async () => {
    browseState.gender=$('#fGender').value; browseState.city=$('#fCity').value; const ag=$('#fAge').value.split('-'); browseState.amin=ag[0]||''; browseState.amax=ag[1]||'';
    const y = new Date().getFullYear();
    let q = sb.from('profiles').select('id,nickname,gender,birth_year,city,occupation,avatar_path,last_active_at').eq('status','approved').neq('id', me.id).order('last_active_at',{ascending:false}).limit(60);
    if(browseState.gender) q = q.eq('gender', browseState.gender);
    if(browseState.city) q = q.eq('city', browseState.city);
    if(browseState.amin) q = q.lte('birth_year', y - +browseState.amin);
    if(browseState.amax) q = q.gte('birth_year', y - +browseState.amax);
    const [{ data: rows, error }, { data: myLikes }] = await Promise.all([q, sb.from('likes').select('to_id').eq('from_id', me.id)]);
    if(error) throw error;
    const liked = new Set((myLikes||[]).map(l=>l.to_id));
    if(!rows.length){ $('#grid').innerHTML = `<p class="muted center" style="grid-column:1/-1;padding:40px 0">目前沒有符合條件的會員，換個條件試試。</p>`; return; }
    $('#grid').innerHTML = rows.map(r => `<div class="pcard" data-id="${r.id}">
        <div class="ph" data-ph="${esc(r.avatar_path||'')}">◌</div>${liked.has(r.id)?'<span class="liked">♥ 已喜歡</span>':''}
        <div class="info"><div class="name"><span>${esc(r.nickname)}</span><span class="muted small">${age(r.birth_year)}</span></div><div class="meta">${esc(r.city||'')}${r.occupation?' · '+esc(r.occupation):''}</div></div></div>`).join('');
    $('#grid').querySelectorAll('.pcard').forEach(c=>c.onclick=()=>openProfile(c.dataset.id));
    $('#grid').querySelectorAll('.ph').forEach(async el=>{ const u = await signed(el.dataset.ph); if(u){ el.style.backgroundImage=`url(${u})`; el.textContent=''; } });
  };
  ['#fGender','#fCity','#fAge'].forEach(s=>$(s).onchange=reload);
  await reload();
}

    sb.from('photo_grants').select('owner_id').eq('owner_id', id).eq('viewer_id', me.id).maybeSingle(),

  const canAct = me.status==='approved';

  const body = `

      <div><h2 style="font-size:24px">${esc(p.nickname)} <span class="muted" style="font-size:16px;font-weight:400">${age(p.birth_year)} 歲</span></h2>
        <div class="muted small">${esc(p.city||'')}${p.height_cm?' · '+p.height_cm+' cm':''}${p.occupation?' · '+esc(p.occupation):''}</div></div>
      ${theirLike?'<span class="chip ok">對方喜歡你</span>':''}
    </div>
    ${(p.tags||[]).length?`<div class="tags mt">${p.tags.map(t=>`<span class="tag on">${esc(t)}</span>`).join('')}</div>`:''}
    <p class="mt" style="white-space:pre-wrap">${esc(p.bio)}</p>
    ${pubPhotos.length?`<div class="gallery">${pubPhotos.map(x=>`<div class="g" data-ph="${esc(x.path)}"></div>`).join('')}</div>`:''}
    ${privCount?`<div class="mt small muted">🔒 ${privCount} 張私密照 · ${grant?'<span class="ok">你已獲授權</span>':(req?.status==='pending'?'已送出索取，等待對方同意':(req?.status==='denied'?'對方未同意':`<button class="btn sm ghost" id="reqPriv" ${canAct?'':'disabled'}>索取查看</button>`))}</div>
      ${grant?`<div class="gallery">${(photos||[]).filter(x=>x.is_private).map(x=>`<div class="g" data-ph="${esc(x.path)}"></div>`).join('')}</div>`:''}`:''}
    <div class="row mt2" style="justify-content:space-between">
      <button class="btn ${myLike?'ghost':'rose'}" id="likeBtn" ${canAct?'':'disabled'}>${myLike?'取消喜歡':'♥ 喜歡'}</button>
      <div class="row"><button class="btn sm ghost" id="blockBtn">封鎖</button><button class="btn sm ghost" id="reportBtn">檢舉</button></div>
    </div>
    ${canAct?'':'<p class="tiny dim mt">檔案審核通過後才能按喜歡或傳訊息</p>'}`;

  signed(p.avatar_path).then(u=>{ if(u) $('#bigPh').style.backgroundImage=`url(${u})`; });

  $('#likeBtn').onclick = async ()=>{
    if(myLike){ await sb.from('likes').delete().eq('from_id',me.id).eq('to_id',id); toast('已取消'); }
    else { const { error } = await sb.from('likes').insert({ from_id:me.id, to_id:id }); if(error) return toast(error.message);
      if(theirLike){ toast('🎉 配對成功！可以開始聊天了'); closeModal(); location.hash='#/matches'; return; } toast('已送出喜歡'); }
    openProfile(id);
  };
  $('#reqPriv') && ($('#reqPriv').onclick = async ()=>{ const { error } = await sb.from('photo_requests').insert({ requester_id:me.id, owner_id:id }); toast(error?error.message:'已送出索取'); openProfile(id); });
  $('#blockBtn').onclick = async ()=>{ if(!confirm(`封鎖 ${p.nickname}？對方將無法再看到你或傳訊息給你。`)) return;

function openReport(id, name){
  modal(`<h3 style="font-size:18px">檢舉 ${esc(name)}</h3>
    <form id="rpForm"><label>原因</label><select name="reason" required>${Object.entries(REPORT_REASONS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>

    <button class="btn primary block mt" type="submit">送出檢舉</button></form>`);
  $('#rpForm').onsubmit = async e=>{ e.preventDefault(); const f=new FormData(e.target);
    const { error } = await sb.from('reports').insert({ reporter_id:me.id, reported_id:id, reason:f.get('reason'), detail:f.get('detail')||null });

}

    ${(grants||[]).length?`<div class="card mt"><h3 style="font-size:17px">已授權查看私密照</h3><div class="list">${grants.map(g=>`<div class="item" style="cursor:default"><div class="grow t">${esc(g.p?.nickname||'')}</div><button class="btn sm ghost revokeBtn" data-id="${g.viewer_id}">收回</button></div>`).join('')}</div></div>`:''}
    <form class="card mt" id="meForm"><h3 style="font-size:17px">編輯檔案</h3><p class="tiny dim">修改暱稱、自介、職業或興趣後會重新送審，期間檔案暫時下架。</p>
      ${profileFormHtml(me)}<button class="btn primary block mt2" type="submit">儲存並送審</button></form>
    ${(blocks||[]).length?`<div class="card mt"><h3 style="font-size:17px">封鎖名單</h3><div class="list">${blocks.map(b=>`<div class="item" style="cursor:default"><div class="grow t">${esc(b.p?.nickname||'')}</div><button class="btn sm ghost unblockBtn" data-id="${b.blocked_id}">解除</button></div>`).join('')}</div></div>`:''}
    <div class="card mt"><h3 style="font-size:17px">帳號</h3><p class="small muted">${esc(session.user.email)}</p>
      <div class="row mt flexwrap"><button class="btn sm ghost" id="pwBtn">更改密碼</button><button class="btn sm ghost" id="logoutBtn">登出</button><button class="btn sm danger" id="delBtn">刪除帳號</button></div></div>
  </div>`;
  bindTagPick();
  signed(me.avatar_path).then(u=>{ if(u) $('#meAv').style.backgroundImage=`url(${u})`; });
  $('#meGal').querySelectorAll('.g').forEach(async el=>{ const u=await signed(el.dataset.ph); if(u) el.style.backgroundImage=`url(${u})`; });
  $('#meAvFile').onchange = async e=>{ const f=e.target.files[0]; if(!f) return; toast('上傳中…');
    try{ const path=await uploadPhoto(f); const { error } = await sb.from('profiles').update({ avatar_path:path }).eq('id',me.id); if(error) throw error; toast('頭像已更新，重新送審'); viewMe(); }catch(err){ toast(err.message); } };

/* =====================================================================
   頁面：管理後台
   ===================================================================== */
async function viewAdmin(){
  if(!me.is_admin){ location.hash='#/browse'; return; }
  let tab = 'profiles';
  const draw = async ()=>{
    $('#app').innerHTML = `<div class="tabs"><button class="${tab==='profiles'?'on':''}" data-t="profiles">待審會員</button><button class="${tab==='photos'?'on':''}" data-t="photos">待審照片</button><button class="${tab==='reports'?'on':''}" data-t="reports">檢舉</button><button class="${tab==='members'?'on':''}" data-t="members">會員查詢</button></div><div id="adm"><div class="spinner"></div></div>`;
    document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ tab=b.dataset.t; draw(); });
    const box = $('#adm');
    if(tab==='profiles'){
      const { data: rows } = await sb.from('profiles').select('*').eq('status','pending').order('updated_at');
      if(!rows?.length){ box.innerHTML='<p class="muted center" style="padding:40px 0">沒有待審會員 ✓</p>'; return; }
      box.innerHTML = rows.map(p=>`<div class="card mb" data-id="${p.id}">
        <div class="row" style="align-items:flex-start"><div class="avatar lg" data-ph="${esc(p.avatar_path||'')}"></div>
          <div class="grow"><b>${esc(p.nickname)}</b> <span class="muted small">${p.gender==='male'?'男':'女'} · ${age(p.birth_year)} 歲 · ${esc(p.city||'')} · 找${({male:'男',female:'女',any:'不限'})[p.looking_for]||''}</span>
            <div class="small muted">${esc(p.occupation||'')} ${p.height_cm?p.height_cm+'cm':''}</div>
            <p class="small mt" style="white-space:pre-wrap">${esc(p.bio)}</p>
            ${containsBadWords(p.bio+' '+p.nickname).length?`<p class="tiny bad">⚠ 含敏感字：${containsBadWords(p.bio+' '+p.nickname).join('、')}</p>`:''}
            <div class="tags mt">${(p.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div></div>
        <div class="row mt flexwrap"><button class="btn sm primary ap" data-id="${p.id}">✓ 通過</button><input class="grow note" placeholder="退件原因（會顯示給會員）" style="padding:8px 12px;font-size:13px"><button class="btn sm ghost rj" data-id="${p.id}">退件</button><button class="btn sm danger sp" data-id="${p.id}">停權</button></div></div>`).join('');
      box.querySelectorAll('.avatar').forEach(async el=>{ const u=await signed(el.dataset.ph); if(u){ el.style.backgroundImage=`url(${u})`; el.onclick=()=>window.open(u,'_blank'); } });
      box.querySelectorAll('.ap').forEach(b=>b.onclick=async()=>{ await sb.from('profiles').update({ status:'approved', review_note:null }).eq('id',b.dataset.id); toast('已通過'); draw(); });
      box.querySelectorAll('.rj').forEach(b=>b.onclick=async()=>{ const note=b.closest('.card').querySelector('.note').value||'請修改後重新送審'; await sb.from('profiles').update({ status:'rejected', review_note:note }).eq('id',b.dataset.id); toast('已退件'); draw(); });
      box.querySelectorAll('.sp').forEach(b=>b.onclick=async()=>{ if(!confirm('確定停權？')) return; await sb.from('profiles').update({ status:'suspended' }).eq('id',b.dataset.id); draw(); });
    }
    if(tab==='photos'){
      const { data: rows } = await sb.from('photos').select('*, p:profiles(nickname)').eq('status','pending').order('created_at');
      if(!rows?.length){ box.innerHTML='<p class="muted center" style="padding:40px 0">沒有待審照片 ✓</p>'; return; }
      box.innerHTML = `<div class="grid">${rows.map(x=>`<div class="pcard" style="cursor:default"><div class="ph" data-ph="${esc(x.path)}"></div><div class="info"><div class="small">${esc(x.p?.nickname||'')} ${x.is_private?'🔒':''}</div>
        <div class="row mt" style="gap:6px"><button class="btn sm primary pa" data-id="${x.id}">通過</button><button class="btn sm ghost pr" data-id="${x.id}">退件</button></div></div></div>`).join('')}</div>`;
      box.querySelectorAll('.ph').forEach(async el=>{ const u=await signed(el.dataset.ph); if(u){ el.style.backgroundImage=`url(${u})`; el.onclick=()=>window.open(u,'_blank'); } });
      box.querySelectorAll('.pa').forEach(b=>b.onclick=async()=>{ await sb.from('photos').update({ status:'approved' }).eq('id',b.dataset.id); draw(); });
      box.querySelectorAll('.pr').forEach(b=>b.onclick=async()=>{ await sb.from('photos').update({ status:'rejected', review_note:'不符合照片規範' }).eq('id',b.dataset.id); draw(); });
    }
    if(tab==='reports'){
      const { data: rows } = await sb.from('reports').select('*, r:profiles!reports_reporter_id_fkey(nickname), t:profiles!reports_reported_id_fkey(id,nickname,status)').eq('status','open').order('created_at');
      if(!rows?.length){ box.innerHTML='<p class="muted center" style="padding:40px 0">沒有未處理檢舉 ✓</p>'; return; }
      box.innerHTML = `<table class="table"><tr><th>時間</th><th>檢舉人</th><th>被檢舉</th><th>原因</th><th>說明</th><th></th></tr>${rows.map(r=>`<tr><td class="tiny">${fmtTime(r.created_at)}</td><td>${esc(r.r?.nickname||'')}</td><td>${esc(r.t?.nickname||'')} <span class="chip">${STATUS_TXT[r.t?.status]||''}</span></td><td>${REPORT_REASONS[r.reason]}</td><td class="small">${esc(r.detail||'')}</td>
        <td><div class="row flexwrap" style="gap:4px"><button class="btn sm ghost msgs" data-id="${r.t?.id}">看訊息</button><button class="btn sm danger sp" data-id="${r.t?.id}" data-r="${r.id}">停權</button><button class="btn sm ghost rs" data-r="${r.id}">結案</button><button class="btn sm ghost dm" data-r="${r.id}">駁回</button></div></td></tr>`).join('')}</table>`;
      box.querySelectorAll('.sp').forEach(b=>b.onclick=async()=>{ if(!confirm('停權此會員？')) return; await sb.from('profiles').update({ status:'suspended' }).eq('id',b.dataset.id); await sb.from('reports').update({ status:'resolved' }).eq('id',b.dataset.r); draw(); });
      box.querySelectorAll('.rs').forEach(b=>b.onclick=async()=>{ await sb.from('reports').update({ status:'resolved' }).eq('id',b.dataset.r); draw(); });
      box.querySelectorAll('.dm').forEach(b=>b.onclick=async()=>{ await sb.from('reports').update({ status:'dismissed' }).eq('id',b.dataset.r); draw(); });
      box.querySelectorAll('.msgs').forEach(b=>b.onclick=async()=>{ const { data: ms } = await sb.from('messages').select('body,created_at,sender_id').eq('sender_id',b.dataset.id).order('created_at',{ascending:false}).limit(50);
        modal(`<h3 style="font-size:16px">最近 50 則訊息</h3>${(ms||[]).map(x=>`<p class="small" style="border-bottom:1px solid var(--line);padding:6px 0"><span class="tiny dim">${fmtTime(x.created_at)}</span> ${esc(x.body)}</p>`).join('')||'<p class="muted">無</p>'}`); });
    }
    if(tab==='members'){
      box.innerHTML = `<div class="row mb"><input id="q" placeholder="暱稱關鍵字" style="padding:9px 12px"><select id="qs" style="width:auto;padding:9px 12px"><option value="">所有狀態</option>${Object.entries(STATUS_TXT).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><button class="btn sm primary" id="qb">搜尋</button></div><div id="qr"></div>`;
      const run = async ()=>{ let q = sb.from('profiles').select('id,nickname,gender,birth_year,city,status,is_admin,created_at,last_active_at').order('created_at',{ascending:false}).limit(100);
        if($('#q').value.trim()) q=q.ilike('nickname',`%${$('#q').value.trim()}%`); if($('#qs').value) q=q.eq('status',$('#qs').value);
        const { data: rows } = await q;
        $('#qr').innerHTML = `<table class="table"><tr><th>暱稱</th><th>性別/年齡</th><th>地區</th><th>狀態</th><th>註冊</th><th></th></tr>${(rows||[]).map(p=>`<tr><td>${esc(p.nickname||'—')}${p.is_admin?' <span class="chip ok">admin</span>':''}</td><td>${p.gender==='male'?'男':p.gender==='female'?'女':'—'} ${age(p.birth_year)}</td><td>${esc(p.city||'')}</td><td><span class="chip">${STATUS_TXT[p.status]}</span></td><td class="tiny">${fmtTime(p.created_at)}</td>
          <td class="row" style="gap:4px">${p.status==='suspended'?`<button class="btn sm ghost un" data-id="${p.id}">解除停權</button>`:`<button class="btn sm danger sp" data-id="${p.id}">停權</button>`}${p.status!=='approved'&&p.nickname?`<button class="btn sm primary ap" data-id="${p.id}">通過</button>`:''}</td></tr>`).join('')}</table>`;
        $('#qr').querySelectorAll('.sp').forEach(b=>b.onclick=async()=>{ if(!confirm('停權？')) return; await sb.from('profiles').update({ status:'suspended' }).eq('id',b.dataset.id); run(); });
        $('#qr').querySelectorAll('.un').forEach(b=>b.onclick=async()=>{ await sb.from('profiles').update({ status:'approved' }).eq('id',b.dataset.id); run(); });
        $('#qr').querySelectorAll('.ap').forEach(b=>b.onclick=async()=>{ await sb.from('profiles').update({ status:'approved', review_note:null }).eq('id',b.dataset.id); run(); });
      };
      $('#qb').onclick=run; run();
    }
  };
  await draw();
}
