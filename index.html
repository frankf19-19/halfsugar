function renderNav(){
  const h = location.hash || '#/';
  const link = (href, txt, badge='') => `<a href="${href}" class="${h.startsWith(href)&&href!=='#/'||h===href?'active':''}">${txt}${badge}</a>`;
  if(!me){
    $('#nav').innerHTML = link('#/plans','會員方案') + link('#/auth','登入／註冊');
    $('#mnav').innerHTML = h.startsWith('#/auth') ? '' : `<a href="#/auth?mode=login">登入</a>`;
    $('#bnav').classList.add('hidden'); document.body.classList.remove('nobnav'); return;
  }
  if(me.status==='incomplete' && !me.is_admin){
    $('#nav').innerHTML = link('#/onboarding','完成註冊') + link('#/me','帳號');
    $('#mnav').innerHTML = `<a href="#/me">帳號</a>`;
    $('#bnav').classList.add('hidden'); document.body.classList.add('nobnav'); return;
  }
  const admin = (me.is_admin ? link('#/admin','後台') : '') + link('#/plans','方案');
  $('#mnav').innerHTML = '';
  $('#nav').innerHTML = link('#/browse','探索') + link('#/likes','心動') + link('#/matches','訊息') + link('#/me','我的') + admin;
  const IC = {
    browse:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2.2 5-5 2.2 2.2-5z"/></svg>',
    likes:'<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.6-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.4-7 10-7 10z"/></svg>',
    matches:'<svg viewBox="0 0 24 24"><path d="M4 6h16v10H9l-5 4z"/></svg>',
    me:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>',
    admin:'<svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>' };
  const bl = (href, i, txt) => `<a href="${href}" class="${h.startsWith(href)?'active':''}">${IC[i]}${txt}</a>`;
  $('#bnav').innerHTML = bl('#/browse','browse','探索') + bl('#/likes','likes','心動') + bl('#/matches','matches','訊息') + bl('#/me','me','我的') + (me.is_admin? bl('#/admin','admin','後台'):'');
  document.body.classList.toggle('nobnav', h.startsWith('#/chat/'));
  $('#bnav').classList.remove('hidden');
  refreshUnread();
}

async function refreshUnread(){
  if(!me || me.status!=='approved') return;
  const { data: ms } = await sb.from('matches').select('id').or(`user_a.eq.${me.id},user_b.eq.${me.id}`);
  const setBadge = n => document.querySelectorAll('a[href="#/matches"]').forEach(a=>{ a.querySelector('.badge')?.remove(); if(n>0) a.insertAdjacentHTML('beforeend',`<span class="badge">${n>99?'99+':n}</span>`); });
  if(!ms || !ms.length) return setBadge(0);
  const { count } = await sb.from('messages').select('id',{count:'exact',head:true}).is('read_at',null).neq('sender_id',me.id).in('match_id',ms.map(m=>m.id));
  setBadge(count||0);
}
setInterval(()=>{ if(document.visibilityState==='visible') refreshUnread(); }, 60000);
let lastHidden = 0;
document.addEventListener('visibilitychange', async ()=>{
  if(document.visibilityState==='hidden'){ lastHidden = Date.now(); return; }
  if(!me || Date.now()-lastHidden < 20000 || $('#modal').innerHTML) return;   // 只離開一下（例如選照片）就不重畫
  const before = me.status; await loadMe(); if(!me) return;
  if(me.status!==before){ if(me.status==='approved') toast('🎉 你的檔案已通過審核，可以開始探索了', 6000); route(); }
  else if(location.hash.startsWith('#/chat/') || location.hash.startsWith('#/matches')) route();
  else refreshUnread();
});

};
let chatChannel = null, routeSeq = 0;
async function route(){
  routeSeq++;
  if(chatChannel){ sb.removeChannel(chatChannel); chatChannel=null; }
  if(!recovering) closeModal();
  const [path, arg] = (location.hash.replace(/^#\//,'').split('?')[0]||'').split('/');
  renderNav();
  document.body.classList.toggle('home', !path || path==='about');
  const app = $('#app'); app.innerHTML = '<div class="spinner"></div>';
  const protectedPages = ['browse','likes','matches','chat','me','admin','onboarding'];
  if(protectedPages.includes(path) && !me){ location.hash='#/auth'; return; }
  if(me && me.status==='incomplete' && ['browse','likes','matches','chat'].includes(path)){ location.hash='#/onboarding'; return; }
  if(!localStorage.getItem('yy_age_ok')) $('#gate').classList.toggle('hidden', ['terms','privacy','guidelines','safety'].includes(path));
  const fn = routes[path] || viewLanding;
  try { await fn(arg); } catch(e){ console.error(e); app.innerHTML = `<div class="banner bad">載入失敗：${esc(zh(e.message||e))}　<a href="javascript:location.reload()">重新整理</a></div>`; }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
window.addEventListener('scroll', ()=>document.body.classList.toggle('scrolled', window.scrollY>40), {passive:true});

  if(me.status==='rejected') return `<div class="banner warn">✎ 你的檔案未通過審核${me.review_note?`：${esc(me.review_note)}`:''}。請到「我的」修改後重新送審。</div>`;
  if(me.status==='suspended') return `<div class="banner bad">⛔ 你的帳號已被停權。如有疑問請聯絡客服${CONFIG.SUPPORT_EMAIL?`：<a href="mailto:${esc(CONFIG.SUPPORT_EMAIL)}">${esc(CONFIG.SUPPORT_EMAIL)}</a>`:''}。</div>`;
  return '';
}

        }
      } else {
        const r = await sb.auth.signInWithPassword({ email, password }); err = r.error;
      }
      btn.disabled=false;
      if(err) $('#authErr').textContent = zh(err.message);
    };
    const fg = $('#forgot'); if(fg) fg.onclick = async ()=>{ const email = $('input[name=email]').value.trim(); if(!email) return toast('請先輸入 Email');
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname }); toast(error?error.message:'重設密碼信已寄出'); };
  };
  draw();
}

function bindTagPick(){ $('#tagPick')?.addEventListener('click', e=>{ const b=e.target.closest('.tag'); if(!b) return;
  if(!b.classList.contains('on') && $('#tagPick').querySelectorAll('.on').length>=8) return toast('最多 8 個興趣'); b.classList.toggle('on'); }); }
function readProfileForm(form){
  const f = new FormData(form); const tags=[...$('#tagPick').querySelectorAll('.on')].map(b=>b.dataset.t);
  const bio = f.get('bio').trim();
  const bad = containsBadWords(bio + ' ' + f.get('nickname') + ' ' + f.get('occupation'));
  if(bad.length) { toast(`自介含不允許的字眼：${bad.join('、')}`); return null; }
  if(/\bline\b|\bline\s*id|\big\b|instagram|telegram|wechat|微信|加賴|加line|09\d{2}[-\s]?\d{3}[-\s]?\d{3}|\d{8,}/i.test(bio)) { toast('自介請勿留下聯絡方式'); return null; }
  if(!f.get('role')) { toast('請選擇你的身分'); return null; }
  let gender = me?.gender, looking_for = me?.looking_for;
  if(f.get('orient')) [gender, looking_for] = f.get('orient').split('-');
  if(!gender || !looking_for) { toast('請選擇想認識的對象'); return null; }
  if(f.get('role')==='daddy' && gender!=='male') { toast('Sugar Daddy 限男性，女性請選 Sugar Mommy'); return null; }
  if(f.get('role')==='mommy' && gender!=='female') { toast('Sugar Mommy 限女性，男性請選 Sugar Daddy'); return null; }
  return { role:f.get('role'), nickname:f.get('nickname').trim(), gender, looking_for, birth_year:+f.get('birth_year'),
    city:f.get('city'), height_cm: f.get('height_cm')? +f.get('height_cm') : null, occupation:f.get('occupation').trim()||null, bio, tags };
}
async function uploadPhoto(file){
  const blob = await compressImage(file);
  const path = `${me.id}/${Date.now()}.jpg`;
  const { error } = await sb.storage.from('photos').upload(path, blob, { contentType:'image/jpeg', upsert:false });
  if(error) throw error; return path;
}

let authUser = null;
const phoneOk = () => !!authUser?.phone_confirmed_at && !!authUser?.phone;
const maskPhone = ph => { const d=String(ph||'').replace(/^886/,'0'); return d.length>=10 ? d.slice(0,4)+'-***-'+d.slice(-3) : d; };
function smsErr(e){
  const m = (e?.code||'')+' '+(e?.message||'');
  if(/phone_exists|already.*(registered|exists)|already been registered/i.test(m)) return '這支手機已經綁定其他帳號。一支手機只能綁定一個帳號。';
  if(/rate|security purposes|after \d+ seconds/i.test(m)) return '發送太頻繁，請稍等 60 秒再試。';
  if(/expired|invalid|otp/i.test(m)) return '驗證碼錯誤或已過期，請重新輸入或重新發送。';
  if(/provider|sms|phone.*(disabled|not enabled)|unsupported/i.test(m)) return '手機驗證服務即將開放，請稍後再回來完成註冊。';
  return '沒有成功：'+(e?.message||'請稍後再試');
}
function viewPhoneVerify(){
  $('#app').innerHTML = `<div class="narrow">
    <div class="obsteps"><span class="on">1　手機驗證</span><span>2　建立檔案</span></div>

    <p class="muted small mt mb">每個帳號都要綁定一支手機，一支手機只能綁定一個帳號，用來確認你是真人、減少假帳號。號碼不會顯示給任何會員，刪除帳號時一併刪除。</p>
    <form id="phForm" class="card">
      <label>手機號碼</label>
      <div class="phrow"><span class="cc">台灣 +886</span><input id="phNum" inputmode="numeric" autocomplete="tel-national" placeholder="0912345678" maxlength="12" required></div>
      <p class="tiny dim mt">目前僅支援台灣手機門號。</p>
      <button class="btn primary block mt2" id="phSend" type="submit">傳送驗證碼</button>
    </form>
    <form id="otpForm" class="card mt hidden">
      <label>簡訊驗證碼</label>
      <input id="otpIn" class="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" required>
      <p class="tiny dim mt" id="otpHint"></p>
      <button class="btn primary block mt2" type="submit">完成驗證</button>
      <button class="btn ghost block mt" type="button" id="otpResend" disabled>重新傳送</button>
    </form><p class="tiny dim center mt2">不是你的帳號？<a href="javascript:void 0" class="obOut">登出</a>　·　<a href="#/me">帳號與刪除</a></p></div>`;
  document.querySelectorAll('.obOut').forEach(a=>a.onclick=async()=>{ await sb.auth.signOut(); location.hash='#/'; });
  let phone='', timer=null;
  const cool = () => { let t=60; const b=$('#otpResend'); b.disabled=true; clearInterval(timer);
    timer=setInterval(()=>{ if(!document.body.contains(b)) return clearInterval(timer); t--; b.textContent = t>0?`重新傳送（${t}）`:'重新傳送'; if(t<=0){ b.disabled=false; clearInterval(timer); } },1000); };
  const send = async () => {
    const { data, error } = await sb.auth.updateUser({ phone });
    if(error){ toast(smsErr(error)); return false; }
    if(data?.user?.phone_confirmed_at && data.user.phone===phone.replace('+','')){ await loadMe(); toast('這支手機已經驗證過了'); route(); return true; }
    $('#otpForm').classList.remove('hidden'); $('#otpHint').textContent=`驗證碼已傳送到 ${maskPhone(phone.replace('+',''))}，請在幾分鐘內輸入。`;
    $('#otpIn').focus(); cool(); return true;
  };
  $('#phForm').onsubmit = async e => { e.preventDefault();
    const n = $('#phNum').value.replace(/[\s-]/g,'');
    if(!/^09\d{8}$/.test(n)) return toast('請輸入 09 開頭的 10 碼手機號碼');
    phone = '+886'+n.slice(1);
    const b=$('#phSend'); b.disabled=true; b.textContent='傳送中…';
    const ok = await send(); b.disabled=false; b.textContent = ok?'改用其他號碼重新傳送':'傳送驗證碼'; };
  $('#otpResend').onclick = send;
  $('#otpForm').onsubmit = async e => { e.preventDefault();
    const token = $('#otpIn').value.replace(/\D/g,''); if(token.length<6) return toast('請輸入 6 位數驗證碼');
    const { error } = await sb.auth.verifyOtp({ phone, token, type:'phone_change' });
    if(error) return toast(smsErr(error));
    await sb.auth.refreshSession(); await loadMe(); toast('手機驗證完成'); route(); };
}

async function viewMatches(){
  const { data: ms } = await sb.from('matches').select('*').or(`user_a.eq.${me.id},user_b.eq.${me.id}`).order('last_message_at',{ascending:false,nullsFirst:false});
  if(!ms || !ms.length){ $('#app').innerHTML = `${statusBanner()}<div class="center" style="padding:60px 0"><p class="muted">還沒有對話。<br class="d">到「探索」看看，遇到想認識的人就直接傳訊息吧。</p><a class="btn mt2" href="#/browse">去探索</a></div>`; return; }
  const ids = ms.map(m=> m.user_a===me.id ? m.user_b : m.user_a);
  const { data: ps } = await sb.from('profiles').select('id,nickname,avatar_path,status').in('id', ids);
  const pm = Object.fromEntries((ps||[]).map(p=>[p.id,p]));
  const { data: unread } = await sb.from('messages').select('match_id').is('read_at', null).neq('sender_id', me.id).in('match_id', ms.map(m=>m.id));
  const uc = {}; (unread||[]).forEach(u=>uc[u.match_id]=(uc[u.match_id]||0)+1);
  const mine = ms.filter(m=>m.initiator===me.id).map(m=>m.id);
  const replied = new Set();
  if(mine.length){ const { data: rp } = await sb.from('messages').select('match_id').neq('sender_id', me.id).in('match_id', mine).limit(1000); (rp||[]).forEach(r=>replied.add(r.match_id)); }
  $('#app').innerHTML = `${statusBanner()}<div class="list">${ms.map(m=>{ const o=pm[m.user_a===me.id?m.user_b:m.user_a] || { nickname:'對方檔案審核中', avatar_path:'' };

}

async function viewChat(matchId){
  const my = routeSeq;
  const { data: m } = await sb.from('matches').select('*').eq('id', matchId).single();
  if(!m){ $('#app').innerHTML='<div class="center" style="padding:60px 0"><p class="muted">這段對話已經關閉。</p><a class="btn mt2" href="#/matches">回到訊息</a></div>'; return; }
  const oid = m.user_a===me.id ? m.user_b : m.user_a;
  const { data: o } = await sb.from('profiles').select('id,nickname,avatar_path').eq('id', oid).maybeSingle();
  const { data: last } = await sb.from('messages').select('*').eq('match_id', matchId).order('created_at',{ascending:false}).limit(300);
  const msgs = (last||[]).reverse();
  if(my!==routeSeq) return;   // 使用者已經離開這個對話
  $('#app').innerHTML = `<div class="chat">
    <div class="hd"><a href="#/matches" class="ib" aria-label="返回">‹</a>
      <div class="avatar" id="chAv" style="width:38px;height:38px"></div><div class="grow name">${o?esc(o.nickname):'<span class="muted">對方檔案審核中</span>'}</div>
      <button class="ib" id="chMore" aria-label="更多">⋯</button></div>
    <div class="msgs" id="msgs"></div>
    <p class="tiny dim center hidden" id="chWait" style="margin:6px 0 0">已送出第一則訊息，對方回覆後就能繼續聊。</p>
    <form id="chForm"><input id="chIn" maxlength="2000" placeholder="寫點什麼…" autocomplete="off"><button class="btn primary" id="chSend">送出</button></form>
</div>`;
  if(o) signed(o.avatar_path).then(u=>{ if(u) $('#chAv').style.backgroundImage=`url("${cssu(u)}")`; });
  const box = $('#msgs');
  let lastDay='';
  const add = (x) => { const d=new Date(x.created_at).toLocaleDateString('zh-TW',{month:'long',day:'numeric',weekday:'short'}); if(d!==lastDay){ lastDay=d; box.insertAdjacentHTML('beforeend', `<div class="day">${d}</div>`); } box.insertAdjacentHTML('beforeend', `<div class="msg ${x.sender_id===me.id?'me':'them'}">${esc(x.body)}<span class="time">${fmtTime(x.created_at)}</span></div>`); box.scrollTop = box.scrollHeight; };
  (msgs||[]).forEach(add);
  let otherReplied = msgs.some(x=>x.sender_id!==me.id), mySent = msgs.some(x=>x.sender_id===me.id);
  const gate = () => { const wait = m.initiator===me.id && !otherReplied && mySent; const off = wait || !['approved','pending'].includes(me.status);
    $('#chIn').disabled = off; $('#chSend').disabled = off; $('#chWait').classList.toggle('hidden', !wait); };
  gate();
  sb.from('messages').update({ read_at:new Date().toISOString() }).eq('match_id', matchId).neq('sender_id', me.id).is('read_at', null).then(()=>refreshUnread());
  chatChannel = sb.channel('chat:'+matchId).on('postgres_changes', { event:'INSERT', schema:'public', table:'messages', filter:`match_id=eq.${matchId}` }, payload => {
    if(payload.new.sender_id!==me.id){ add(payload.new); otherReplied=true; gate(); sb.from('messages').update({ read_at:new Date().toISOString() }).eq('id', payload.new.id).then(()=>{}); }
  }).subscribe();
  $('#chForm').onsubmit = async e => { e.preventDefault(); const body=$('#chIn').value.trim(); if(!body) return;
    const bad = containsBadWords(body); if(bad.length) return toast(`訊息含不允許的字眼：${bad.join('、')}`);
    $('#chIn').value='';
    const { data, error } = await sb.from('messages').insert({ match_id:matchId, sender_id:me.id, body }).select().single();
    if(error){ if(!$('#chIn').value) $('#chIn').value=body; return toast('沒有送出：'+error.message); } add(data); mySent=true; gate(); };
  $('#chMore') && ($('#chMore').onclick=()=>{ modal(`<div class="sheet">
      ${o?'<button class="it" id="shProf">查看檔案</button>':''}
      <button class="it" id="shReport">檢舉</button>
      <button class="it bad" id="shBlock">封鎖</button>
      <button class="it bad" id="shUnmatch">結束對話</button>
      <p class="tiny dim" style="padding:14px 4px 0">請勿在對話中要求或提供任何金錢。遇到不當內容請封鎖並檢舉。</p></div>`);
    $('#shProf') && ($('#shProf').onclick=()=>openProfile(oid));
    $('#shReport').onclick=()=>openReport(oid, o?.nickname||'這位會員');
    $('#shBlock').onclick=async()=>{ if(!confirm('封鎖後，對方看不到你，這段對話也會關閉。確定？')) return;
      const { error } = await sb.from('blocks').insert({ blocker_id:me.id, blocked_id:oid }); if(error && error.code!=='23505') return toast(error.message);
      toast('已封鎖'); closeModal(); location.hash='#/matches'; };
    $('#shUnmatch').onclick=async()=>{ if(!confirm('結束後，雙方都看不到這段對話。之後任何一方再傳訊息，會從新的對話開始。確定？')) return; const { error } = await sb.rpc('unmatch', { mid: matchId }); if(error) return toast(error.message); closeModal(); location.hash='#/matches'; }; });
}

  document.querySelectorAll('.revokeBtn').forEach(b=>b.onclick=async()=>{ if(await act(()=>sb.from('photo_grants').delete().eq('owner_id',me.id).eq('viewer_id',b.dataset.id))) await act(()=>sb.from('photo_requests').delete().eq('owner_id',me.id).eq('requester_id',b.dataset.id), '已收回'); viewMe(); });

  const pv = async (patch, msg) => { const { error } = await sb.from('profiles').update(patch).eq('id', me.id); if(error) return toast(error.message); Object.assign(me, patch); toast(msg); };
  $('#pvHidden').onchange = e => pv({ hidden: e.target.checked }, e.target.checked ? '已隱藏，你不會出現在探索' : '已恢復出現在探索');
  $('#pvOnline').onchange = e => pv({ show_online: e.target.checked }, e.target.checked ? '已開啟上線狀態' : '已隱藏上線狀態');
  $('#meForm').onsubmit = async e=>{ e.preventDefault(); const p=readProfileForm(e.target); if(!p) return;
    const { error } = await sb.from('profiles').update(p).eq('id',me.id); if(error) return toast(error.message);
    if(me.status==='rejected'){ const { error: e2 } = await sb.rpc('resubmit_profile'); if(e2) return toast(e2.message); toast('已重新送審'); } else toast('已儲存');
    viewMe(); };
  bindAccount();

    $('#delYes').onclick = async ()=>{ const b=$('#delYes'); b.disabled=true; b.textContent='刪除中…';
      try{

        let r = await sb.rpc('begin_account_deletion'); if(r.error) throw r.error;

        // 3. 刪除帳號（含手機、信箱與所有資料）
        r = await sb.rpc('delete_my_account'); if(r.error) throw r.error;

async function viewAdmin(){

          <div class="grow"><b>${esc(p.nickname)}</b> <span class="rtag">${ROLES[p.role]||'未選身分'}</span><div class="muted small">${orientText(p)}</div><div class="muted small">${age(p.birth_year)} 歲 · ${esc(p.city||'')}</div>
            <div class="small muted">${esc(p.occupation||'')} ${p.height_cm?p.height_cm+'cm':''}</div>
            <p class="small mt" style="white-space:pre-wrap">${esc(p.bio)}</p>
            ${containsBadWords(p.bio+' '+p.nickname).length?`<p class="tiny bad">⚠ 含敏感字：${containsBadWords(p.bio+' '+p.nickname).join('、')}</p>`:''}
            <div class="tags mt">${(p.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div></div>
        <div class="row mt flexwrap"><button class="btn sm primary ap" data-id="${p.id}">✓ 通過</button><input class="grow note" placeholder="退件原因（會顯示給會員）" style="padding:8px 12px;font-size:13px"><button class="btn sm ghost rj" data-id="${p.id}">退件</button><button class="btn sm danger sp" data-id="${p.id}">停權</button></div></div>`).join('');
      box.querySelectorAll('.avatar').forEach(async el=>{ const u=await signed(el.dataset.ph); if(u){ el.style.backgroundImage=`url("${cssu(u)}")`; el.onclick=()=>window.open(u,'_blank'); } });
      const done = (b,msg) => { toast(msg); const c=b.closest('.card'); c.style.opacity=.3; setTimeout(()=>{ c.remove(); if(!box.querySelector('.card')) draw(); },300); };
      box.querySelectorAll('.ap').forEach(b=>b.onclick=async()=>{ b.disabled=true; if(await adm(sb.from('profiles').update({ status:'approved', review_note:null }).eq('id',b.dataset.id))) done(b,'已通過'); else b.disabled=false; });
      box.querySelectorAll('.rj').forEach(b=>b.onclick=async()=>{ const note=b.closest('.card').querySelector('.note').value||'請修改後重新送審'; if(await adm(sb.from('profiles').update({ status:'rejected', review_note:note }).eq('id',b.dataset.id))) done(b,'已退件'); });
      box.querySelectorAll('.sp').forEach(b=>b.onclick=async()=>{ if(!confirm('確定停權？')) return; await adm(sb.from('profiles').update({ status:'suspended' }).eq('id',b.dataset.id)); draw(); });
    }
    if(tab==='photos'){
      const { data: rows } = await sb.from('photos').select('*, p:profiles(nickname)').eq('status','pending').order('created_at');
      if(!rows?.length){ box.innerHTML='<p class="muted center" style="padding:40px 0">沒有待審照片 ✓</p>'; return; }
      box.innerHTML = `<div class="grid">${rows.map(x=>`<div class="pcard" style="cursor:default"><div class="ph" data-ph="${esc(x.path)}"></div><div class="info"><div class="small">${esc(x.p?.nickname||'')} ${x.is_private?'🔒':''}</div>
        <div class="row mt" style="gap:6px"><button class="btn sm primary pa" data-id="${x.id}">通過</button><button class="btn sm ghost pr" data-id="${x.id}">退件</button></div></div></div>`).join('')}</div>`;

    }
    if(tab==='reports'){
      const { data: rows } = await sb.from('reports').select('*, r:profiles!reports_reporter_id_fkey(nickname), t:profiles!reports_reported_id_fkey(id,nickname,status)').eq('status','open').order('created_at');
