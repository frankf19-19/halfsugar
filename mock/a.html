<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A 雜誌</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;900&family=Bodoni+Moda:ital,opsz,wght@1,6..96,500&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:"Noto Sans TC";background:#fff;color:#111}
nav{display:flex;justify-content:space-between;align-items:center;padding:22px 5vw;border-bottom:1px solid #111}
.logo{font-weight:900;font-size:22px;letter-spacing:.3em}.nav a{margin-left:28px;color:#111;text-decoration:none;font-size:14px}
.hero{display:grid;grid-template-columns:7fr 5fr;min-height:84vh;border-bottom:1px solid #111}
.hero .t{padding:6vw 5vw;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid #111}
h1{font-weight:900;font-size:clamp(56px,8.5vw,140px);line-height:.98;letter-spacing:-.02em}
h1 em{font-family:"Bodoni Moda";font-weight:500;font-style:italic;font-size:.62em;letter-spacing:0;display:block;margin-top:14px}
.hero p{max-width:420px;font-size:16px;line-height:1.9;color:#333}
.btn{display:inline-block;margin-top:26px;background:#111;color:#fff;padding:16px 34px;font-size:15px;text-decoration:none}
.img{background:url(https://images.unsplash.com/photo-1616917287358-eee34867bbc1?auto=format&fit=crop&w=1400&q=80) center/cover}
.row{display:grid;grid-template-columns:repeat(3,1fr)}.row div{padding:40px 5vw;border-right:1px solid #111}.row div:last-child{border:0}
.row b{font-size:42px;font-weight:900;display:block}.row span{font-size:14px;color:#444}

<div class="row"><div><b>24h</b><span>內完成審核</span></div><div><b>100%</b><span>照片真人審核</span></div><div><b>0</b><span>則不想要的訊息</span></div></div>
</body></html>
