<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C 現代 App</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:"Noto Sans TC";background:#FBF6F3;color:#2A1A1F}
nav{display:flex;justify-content:space-between;align-items:center;padding:20px 6vw}
.logo{font-weight:900;font-size:24px;color:#7A1F35}.nav a{margin-left:24px;font-size:14px}
.nav .j{background:#7A1F35;color:#fff;padding:10px 20px;border-radius:999px}
.hero{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:4vw;padding:4vw 6vw 6vw}
h1{font-weight:900;font-size:clamp(40px,5.4vw,78px);line-height:1.15;letter-spacing:-.01em}
h1 span{color:#7A1F35}
p{margin:22px 0 32px;font-size:17px;line-height:1.9;color:#5B4A4F;max-width:460px}
.btn{display:inline-block;background:#7A1F35;color:#fff;padding:17px 34px;border-radius:999px;font-weight:700;font-size:16px}
.stack{position:relative;height:560px}
.card{position:absolute;width:300px;height:420px;border-radius:26px;background:#ddd center/cover;box-shadow:0 30px 60px rgba(122,31,53,.18);overflow:hidden}
.card .i{position:absolute;left:0;right:0;bottom:0;padding:22px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65))}
.card b{font-size:24px}.card small{display:block;opacity:.85;font-size:13px;margin-top:2px}
.c1{left:0;top:60px;transform:rotate(-6deg);background-image:url(https://images.unsplash.com/photo-1697257378991-b57497dddc69?auto=format&fit=crop&w=1400&q=80)}
.c2{left:180px;top:0;transform:rotate(4deg);background-image:url(https://images.unsplash.com/photo-1604341305834-7ced4100b50a?auto=format&fit=crop&w=1400&q=80)}
.like{position:absolute;left:330px;top:420px;background:#fff;border-radius:999px;padding:12px 20px;box-shadow:0 10px 30px rgba(0,0,0,.12);font-weight:700;color:#7A1F35}
</style></head><body><nav><div class="logo">悅遇</div><div class="nav"><a>關於</a><a>登入</a><a class="j">免費加入</a></div></nav>
<section class="hero"><div><h1>互相喜歡，<br><span>才開始聊。</span></h1><p>每一個檔案都由真人審核，沒有假帳號、沒有廣告。你按喜歡、對方也按喜歡，對話才會打開。</p><a class="btn">免費建立檔案</a></div>
<div class="stack"><div class="card c1"><div class="i"><b>Claire, 32</b><small>台北 · 設計師</small></div></div><div class="card c2"><div class="i"><b>Vivian, 29</b><small>台中 · 品牌公關</small></div></div><div class="like">♥ 你們互相喜歡</div></div></section>
</body></html>
